# CI（规范 §9）：推送 main 后在 Linux 上执行与本机 pnpm verify 相同的门禁，另加依赖漏洞扫描；
# 与之并行的 container job 用生产镜像跑容器 E2E（P5）。两个 job 都通过才算 CI 全绿。
# 各个 Action 按提交的 SHA 锁定，注释里写对应的版本。
name: CI

on:
  push:
    branches: [main]
  schedule:
    # 每周一 03:00（UTC）定时执行，发现浏览器与依赖环境的漂移
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: pnpm verify --ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # 与 deploy/dev/compose.yaml 同一个镜像（18.6-alpine 的多架构索引摘要）
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: nerve
          POSTGRES_PASSWORD: nerve_ci_only
          POSTGRES_DB: nerve_office
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerve -d nerve_office"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: 'true'
      NERVE_TEST_DATABASE_URL: postgres://nerve:nerve_ci_only@127.0.0.1:5432/nerve_office
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 取完整历史：迁移门禁拿这次推送之前的提交作基准，确认已合并的迁移没有被改动（ADR-005）
          fetch-depth: 0

      - name: 安装 Node.js（版本见 .node-version）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 安装 pnpm（版本见 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装浏览器（Chromium、WebKit、Chrome、Edge）及系统依赖
        run: pnpm --filter @nerve-office/e2e exec playwright install --with-deps chromium webkit chrome msedge

      - name: pnpm verify --ci
        run: pnpm verify --ci --keep-going
        env:
          # 推送事件：迁移门禁拿推送之前的提交作基准，一次推送里的每个提交都在比较范围内；定时与手动触发时为空，门禁改用 HEAD^1
          GATE_MIGRATIONS_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}

      # 总是上传：重试后通过的用例也要能查到报告（规范 §8.4，出现重试即记为不稳定）
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            coverage/
          retention-days: 14

  # 容器 E2E（P5 设计 §3.7）：用生产镜像起测试环境（应用 + PostgreSQL + Caddy 的 HTTPS，应用以受限的数据库角色运行），
  # 对它跑 E2E 的外部模式与重启用例（US-M1-10）。只跑 Chromium：四个浏览器的覆盖由 verify 的 E2E 承担
  container:
    name: pnpm test:e2e:container
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js（版本见 .node-version）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 安装 pnpm（版本见 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装浏览器（Chromium）及系统依赖
        run: pnpm --filter @nerve-office/e2e exec playwright install --with-deps chromium

      # 构建镜像（linux/amd64）、起测试环境、核对部署配置（经代理的探针、客户端地址、应用的端口）、跑 E2E，打印镜像体积与应用容器的内存
      - name: pnpm test:e2e:container
        run: pnpm test:e2e:container

      - name: 上传测试报告与容器日志
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-reports-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
