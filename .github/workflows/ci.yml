# CI（规范 §9）：推送 main 后在 Linux 上执行与本机 pnpm verify 相同的门禁，另加依赖漏洞扫描；
# 与之并行的 container job 用生产镜像跑容器 E2E（P5）。全部 job 都通过才算 CI 全绿。
# 门禁分成两类 job（M2-P4；本机仍是一条 pnpm verify）：
# - verify：除 E2E 之外的全部步骤（--scope=no-e2e）；
# - e2e：按浏览器分片（--scope=e2e，每片一个浏览器），四片并行。
#   分片之前一个 job 要 37 分钟，时限是 45 分钟（M2-P3 合并之后的实测），再加用例就会超时。
#   两个 scope 合起来与完整的一套完全相同，由 tools/src/verify/plan.test.ts 的用例守住。
# 各个 Action 按提交的 SHA 锁定，注释里写对应的版本。
name: CI

on:
  push:
    branches: [main]
  schedule:
    # 每周一 03:00（UTC）定时执行，发现浏览器与依赖环境的漂移
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: pnpm verify --ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # 与 deploy/dev/compose.yaml 同一个镜像（18.6-alpine 的多架构索引摘要）
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: nerve
          POSTGRES_PASSWORD: nerve_ci_only
          POSTGRES_DB: nerve_office
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerve -d nerve_office"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: 'true'
      # 固定一次性托管 VM 按宿主生命周期回收原环境；报告先独立验证稳定导出。
      NERVE_TEST_RESOURCE_POLICY: github-hosted-vm
      # 仅托管 Ubuntu 24.04 的固定只读 lsof 查询提权；运行器及测试仍使用普通用户。
      NERVE_TEST_LSOF_MODE: github-ubuntu-sudo
      NERVE_TEST_DATABASE_URL: postgres://nerve:nerve_ci_only@127.0.0.1:5432/nerve_office
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 取完整历史：迁移门禁拿这次推送之前的提交作基准，确认已合并的迁移没有被改动（ADR-005）
          fetch-depth: 0

      # 在下载依赖/浏览器前确认同一受管查询与清理路径可用；不替代删除前核验。
      - name: 核对测试资源能力（KiB 级预检）
        id: resource-preflight
        timeout-minutes: 3
        run: python3 -B tools/test-resources/run.py ci-preflight -- /usr/bin/true

      # 安装前失败也必须留下原 runId 和清理状态；不读取或上传 scratch 内容。
      - name: 保存预检的有界状态回执
        id: resource-preflight-receipt
        if: always()
        timeout-minutes: 1
        run: python3 -B tools/test-resources/ci_preflight_receipt.py

      - name: 安装 Node.js（版本见 .node-version）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 安装 pnpm（版本见 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: pnpm verify --ci --scope=no-e2e
        run: pnpm verify --ci --keep-going --scope=no-e2e
        env:
          # 推送事件：迁移门禁拿推送之前的提交作基准，一次推送里的每个提交都在比较范围内；定时与手动触发时为空，门禁改用 HEAD^1
          GATE_MIGRATIONS_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}

      - name: 核对本轮资源处置与报告导出
        id: resource-check
        if: always()
        timeout-minutes: 3
        run: python3 -B tools/test-resources/check_ci_resources.py

      # 产品失败仍可上传已经通过资源核验的报告；原检查步骤保持失败。
      - name: 上传覆盖率报告
        id: resource-upload
        if: always() && steps.resource-check.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ github.run_id }}
          path: .test-resources/runs/*/reports/portable/test-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  # E2E：按浏览器分片并行（M2-P4）。每片自己构建（E2E 要用构建产物），跑一个浏览器的全部用例；
  # 重启用例（US-M1-10）只在带 chromium 的那一片里跑一次（playwright.config.ts）
  e2e:
    name: pnpm verify --ci --scope=e2e（${{ matrix.browser }}）
    runs-on: ubuntu-24.04
    # 执行器给原 Playwright CLI 90 分钟运行 + 独立 15 分钟夹具/报告收尾，再最多 1 分钟强制核验。
    # 外层步骤 115、job 140 分钟留构建/安装/归档余量；原单例时限、重试与浏览器范围不变。
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, webkit, msedge]
    services:
      postgres:
        # 与 deploy/dev/compose.yaml 同一个镜像（18.6-alpine 的多架构索引摘要）
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: nerve
          POSTGRES_PASSWORD: nerve_ci_only
          POSTGRES_DB: nerve_office
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerve -d nerve_office"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: 'true'
      NERVE_TEST_RESOURCE_POLICY: github-hosted-vm
      NERVE_TEST_LSOF_MODE: github-ubuntu-sudo
      NERVE_TEST_DATABASE_URL: postgres://nerve:nerve_ci_only@127.0.0.1:5432/nerve_office
      E2E_BROWSERS: ${{ matrix.browser }}
      E2E_LOGIN_POPUP_DIAGNOSTIC: ${{ matrix.browser == 'webkit' && '1' || '' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 在下载依赖/浏览器前确认同一受管查询与清理路径可用；不替代删除前核验。
      - name: 核对测试资源能力（KiB 级预检）
        id: resource-preflight
        timeout-minutes: 3
        run: python3 -B tools/test-resources/run.py ci-preflight -- /usr/bin/true

      # 安装前失败也必须留下原 runId 和清理状态；不读取或上传 scratch 内容。
      - name: 保存预检的有界状态回执
        id: resource-preflight-receipt
        if: always()
        timeout-minutes: 1
        run: python3 -B tools/test-resources/ci_preflight_receipt.py

      - name: 安装 Node.js（版本见 .node-version）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 安装 pnpm（版本见 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装浏览器（${{ matrix.browser }}）及系统依赖
        run: pnpm --filter @nerve-office/e2e exec playwright install --with-deps ${{ matrix.browser }}

      - name: 独占登记本轮 E2E 进程身份
        id: e2e-prepare
        env:
          # runner 上下文仅在步骤环境可用。目录仍在 outputDir 外，重跑也不覆盖旧记录。
          NERVE_CI_E2E_STATE: ${{ runner.temp }}/nerve-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}
        run: |
          node tools/src/ci/e2e-cli.ts prepare
          printf 'NERVE_CI_E2E_STATE=%s\n' "$NERVE_CI_E2E_STATE" >> "$GITHUB_ENV"

      - name: pnpm verify --ci --scope=e2e
        timeout-minutes: 115
        run: pnpm verify --ci --keep-going --scope=e2e

      - name: 确认本轮全部写入者退出（含外层终止后的恢复收尾）
        id: e2e-quiescence
        if: always() && steps.e2e-prepare.outcome == 'success'
        timeout-minutes: 17
        run: node tools/src/ci/e2e-cli.ts settle

      - name: 核对原始 JSON 与 HTML 报告存在且完整
        id: e2e-report-check
        if: always() && steps.e2e-prepare.outcome == 'success'
        run: node tools/src/ci/e2e-cli.ts reports

      # 只把已核验的便携资料打包到同轮 transport；原环境留在 scratch 等待宿主回收。
      # 固定入口负责登记、压缩限额、成员与哈希核验及预算复核，不改写原稳定导出树。
      - name: 无损归档浏览器持久资料
        id: profile-archive
        if: always() && steps.e2e-quiescence.outcome == 'success' && steps.e2e-report-check.outcome == 'success'
        timeout-minutes: 10
        run: python3 -B tools/test-resources/pack_ci_profiles.py

      # 产品失败仍保留安全报告；归档失败不能回退上传未压缩的 profile 目录。
      - name: 上传测试报告
        id: e2e-upload
        if: always() && steps.e2e-quiescence.outcome == 'success' && steps.e2e-report-check.outcome == 'success' && steps.profile-archive.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-reports-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            .test-resources/runs/*/reports/portable/test-results/
            .test-resources/runs/*/reports/transport/
            !tests/e2e/test-results/persistent-profiles/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: 生成独立静态退出诊断快照
        id: e2e-diagnostics-prepare
        if: always() && steps.e2e-prepare.outcome == 'success'
        run: node tools/src/ci/e2e-cli.ts diagnostics

      - name: 上传本轮退出核验记录
        id: e2e-diagnostics
        if: always() && steps.e2e-diagnostics-prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-supervisor-${{ matrix.browser }}-${{ github.run_id }}
          path: ${{ env.NERVE_CI_E2E_STATE }}-diagnostics/
          retention-days: 14
          if-no-files-found: error

  # 容器 E2E（P5 设计 §3.7）：用生产镜像起测试环境（应用 + PostgreSQL + Caddy 的 HTTPS，应用以受限的数据库角色运行），
  # 对它跑 E2E 的外部模式与重启用例（US-M1-10）。只跑 Chromium：四个浏览器的覆盖由 verify 的 E2E 承担
  container:
    name: pnpm test:e2e:container
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NERVE_TEST_RESOURCE_POLICY: github-hosted-vm
      NERVE_TEST_LSOF_MODE: github-ubuntu-sudo
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 在下载依赖/浏览器前确认同一受管查询与清理路径可用；不替代删除前核验。
      - name: 核对测试资源能力（KiB 级预检）
        id: resource-preflight
        timeout-minutes: 3
        run: python3 -B tools/test-resources/run.py ci-preflight -- /usr/bin/true

      # 安装前失败也必须留下原 runId 和清理状态；不读取或上传 scratch 内容。
      - name: 保存预检的有界状态回执
        id: resource-preflight-receipt
        if: always()
        timeout-minutes: 1
        run: python3 -B tools/test-resources/ci_preflight_receipt.py

      - name: 安装 Node.js（版本见 .node-version）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 安装 pnpm（版本见 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装浏览器（Chromium）及系统依赖
        run: pnpm --filter @nerve-office/e2e exec playwright install --with-deps chromium

      # 构建镜像（linux/amd64）、起测试环境、核对部署配置（经代理的探针、客户端地址、应用的端口）、跑 E2E，打印镜像体积与应用容器的内存
      - name: pnpm test:e2e:container
        run: pnpm test:e2e:container

      - name: 核对本轮资源处置与报告导出
        id: resource-check
        if: always()
        timeout-minutes: 3
        run: python3 -B tools/test-resources/check_ci_resources.py

      - name: 上传测试报告与容器日志
        id: resource-upload
        if: always() && steps.resource-check.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-reports-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            .test-resources/runs/*/reports/portable/test-results/
          include-hidden-files: true
          retention-days: 14
