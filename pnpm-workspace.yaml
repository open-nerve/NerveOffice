# 供应链（规范 §3，ADR-001）：新发布的版本满 3 天（4320 分钟）才允许安装；显式配置后默认严格拦截
minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true

# 新版本的发布可信度（如来源证明）不得低于旧版本
trustPolicy: no-downgrade

peerDependencyRules:
  allowedVersions:
    # 6.10.2 的 peer 只声明到 ESLint 9；在 ESLint 10 下能加载、规则能生效，由 lint 规则的自测验证
    eslint-plugin-jsx-a11y>eslint: 10.11.0

# 脚本在 pnpm 内置的 POSIX shell 里执行，各平台一致
shellEmulator: true
engineStrict: true

packages:
  - apps/*
  - packages/*
  - tools
  - tests/*

# 依赖的安装脚本逐个决定，新增一项要写原因（规范 §3）
allowBuilds:
  # postinstall 只校验本平台的原生二进制；pnpm 已按平台装好可选依赖里的二进制。drizzle-kit 用它读取表定义，只在开发时使用（M1-P2）
  esbuild: false
  # postinstall 只是执行 `lefthook install`；根 package.json 的 prepare 已经显式执行
  lefthook: false
  # postinstall 只检查原生绑定；pnpm 已按平台安装了可选依赖里的绑定
  unrs-resolver: false

# 外部依赖的版本集中写在默认目录里，各包写 catalog 引用；版本一律精确（规范 §3）
