# 供应链（规范 §3，ADR-001）：新发布的版本满 3 天（4320 分钟）才允许安装；显式配置后默认严格拦截
minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true

# 新版本的发布可信度（如来源证明）不得低于旧版本
trustPolicy: no-downgrade

peerDependencyRules:
  allowedVersions:
    # 6.10.2 的 peer 只声明到 ESLint 9；在 ESLint 10 下能加载、规则能生效，由 lint 规则的自测验证
    eslint-plugin-jsx-a11y>eslint: 10.11.0

# 脚本在 pnpm 内置的 POSIX shell 里执行，各平台一致
shellEmulator: true
engineStrict: true

packages:
  - apps/*
  - packages/*
  - tools
  - tests/*

patchedDependencies:
  # ADR-022：单元格元素缓存走平台鉴权与实例登记；取消不回退原 URL，先登记再等待读取。
  '@univerjs/core@1.0.1': patches/@univerjs__core@1.0.1.patch
  # ADR-022：浮图初次加载及桌面/移动更新统一走实例 IO，迟到结果检查来源和场景存活。
  '@univerjs/drawing-ui@1.0.1': patches/@univerjs__drawing-ui@1.0.1.patch
  # ADR-022、UR-009：刷新 transform 时同步明确提供的两份工作表锚点。
  '@univerjs/drawing@1.0.1': patches/@univerjs__drawing@1.0.1.patch
  # ADR-022：IMAGE 快照补算；在定义名称展开前证明字面量来源并沿实际位置传递，保留原快照格式。
  '@univerjs/engine-formula@1.0.1': patches/@univerjs__engine-formula@1.0.1.patch
  # ADR-022、UR-006：坏图/未完成元素不进入 drawImage，换源不污染其他图元共用元素。
  '@univerjs/engine-render@1.0.1': patches/@univerjs__engine-render@1.0.1.patch
  # ADR-010、UR-038：公式条件确认依据当前文本，修正后不被旧错误状态拦截。
  '@univerjs/sheets-conditional-formatting-ui@1.0.1': patches/@univerjs__sheets-conditional-formatting-ui@1.0.1.patch
  # ADR-010、UR-033：数据验证面板按输入顺序积累字段增量，同步历史正文与公式平移，保留提交和退役边界。
  '@univerjs/sheets-data-validation-ui@1.0.1': patches/@univerjs__sheets-data-validation-ui@1.0.1.patch
  # ADR-010、DEF-056：真实输入/退役取消旧任务；公式结果更新代次，共享等待最终结论及真实错误。
  '@univerjs/sheets-data-validation@1.0.1': patches/@univerjs__sheets-data-validation@1.0.1.patch
  # ADR-022、UR-031：插入量尺寸走实例 IO，切表/销毁后取消；Ready 只静默正常退役。
  '@univerjs/sheets-drawing-ui@1.0.1': patches/@univerjs__sheets-drawing-ui@1.0.1.patch
  # ADR-022、UR-009：Position 自动行高重算起止锚点，保持尺寸和原属性的缺省状态。
  '@univerjs/sheets-drawing@1.0.1': patches/@univerjs__sheets-drawing@1.0.1.patch
  # ADR-010、UR-036：范围高亮配对使用当前文本和解析结果，避免快速输入被旧语法树覆盖。
  '@univerjs/sheets-formula-ui@1.0.1': patches/@univerjs__sheets-formula-ui@1.0.1.patch
  # ADR-022：IMAGE 量尺寸、取消与恢复走实例 IO，采用真实原件几何并拒绝过时批次写回。
  '@univerjs/sheets-formula@1.0.1': patches/@univerjs__sheets-formula@1.0.1.patch
  # ADR-010、M5-P3：表单、粘贴与导航可配置同一地址规范化，保留 SDK 默认协议检查。
  '@univerjs/sheets-hyper-link-ui@1.0.1': patches/@univerjs__sheets-hyper-link-ui@1.0.1.patch
  # ADR-022：桌面右键菜单先恢复当前编辑器焦点，再同步执行命令，保留图片焦点守卫。
  '@univerjs/ui@1.0.1': patches/@univerjs__ui@1.0.1.patch
# 依赖的安装脚本逐个决定，新增一项要写原因（规范 §3）
allowBuilds:
  # postinstall 只校验本平台的原生二进制；pnpm 已按平台装好可选依赖里的二进制。drizzle-kit 用它读取表定义，只在开发时使用（M1-P2）
  esbuild: false
  # postinstall 只是执行 `lefthook install`；根 package.json 的 prepare 已经显式执行
  lefthook: false
  # 经 @univerjs/core → @univerjs/protocol → @grpc/grpc-js → @grpc/proto-loader 引入（M1-P4）。postinstall 只检查依赖方声明的版本写法、
  # 打印警告，不构建任何东西；编辑器只用 protocol 的类型与枚举，不加载 protobufjs（M0-P1 报告 §2.2）
  protobufjs: false
  # Sharp 使用锁定的平台绑定和共享 libvips 包；不运行安装脚本或临时下载/编译本机库（ADR-021）
  sharp: false
  # postinstall 只检查原生绑定；pnpm 已按平台安装了可选依赖里的绑定
  unrs-resolver: false

# 外部依赖的版本集中写在默认目录里，各包写 catalog 引用；版本一律精确（规范 §3）
