  '@antfu/eslint-config': 9.5.1
  '@eslint-react/eslint-plugin': 5.20.5
  '@nestjs/cli': 12.0.5
  '@nestjs/common': 12.1.0
  '@nestjs/core': 12.1.0
  '@nestjs/platform-express': 12.1.0
  '@nestjs/testing': 12.1.0
  '@node-rs/argon2': 2.2.1
  '@playwright/test': 1.63.0
  '@tailwindcss/vite': 4.3.3
  '@tanstack/react-query': 5.103.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@types/express': 5.0.6
  '@types/node': 24.13.6
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # Univer：表格编辑器 sheet@1 用到的包（插件档案 v1 §1），全部是同一个精确版本（00 号计划书 §3.2，门禁 deps 按 UNIVER_POLICY 核对）。
  # 用 1.0.1 而不是 1.0.0：两者的产物相同（内嵌的版本号除外），1.0.0 的一部分包是人工发布、没有来源证明，过不了 trustPolicy
